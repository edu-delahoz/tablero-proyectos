<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de proyectos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3Erect%7Bfill:%23b0532f%7D@media(prefers-color-scheme:dark)%7Brect%7Bfill:%23d97757%7D%7D%3C/style%3E%3Crect width='32' height='32' rx='8'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>
// Tema antes de pintar (sin parpadeo).
(function () {
  var t = null;
  try { t = localStorage.getItem('tablero.tema'); } catch (_) {}
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* ===================== Tokens (estilo terminal; claro/oscuro con light-dark) ===================== */
:root {
  color-scheme: light dark;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --fondo: light-dark(#f4efe6, #191816); --superficie: light-dark(#f4efe6, #191816); --panel: light-dark(#ece5d8, #211f1c);
  --borde: light-dark(#cbc1b0, #45413a); --texto: light-dark(#2b2925, #e8e4da); --suave: light-dark(#6b6457, #9a9384);
  --acento: light-dark(#b0532f, #d97757); --sobre-acento: light-dark(#fff, #191816);
  --ok: light-dark(#3d7a37, #8cc265); --aviso: light-dark(#8a5d00, #e5c07b); --peligro: light-dark(#b3392f, #e06c75); --morado: light-dark(#7a4fb0, #c678dd);
  --azul: light-dark(#1f6fb2, #61afef); --cian: light-dark(#0f7a7a, #56b6c2);
  --barra: light-dark(#d9d0c0, #3a3731); --codigo: light-dark(#e9e2d4, #25231f); --sel: light-dark(#e8dccb, #2c2925);
  --estado-fondo: light-dark(#e3dbcb, #26241f);
  --alto-barra: 28px; --margen-rotulo: 14px;
  --prosa: var(--mono); --titulos: var(--mono); --tam: 14px; --radio: 0;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* ===================== Base ===================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: var(--tam)/1.55 var(--prosa); }
a { color: var(--acento); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
::selection { background: var(--sel); }
code, .hash, .chip, .n, .barra-txt, .glifo, .icono, .casilla, .rotulo, .segmentos, .archivos, #barra-estado, .prompt, .rama, textarea { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.suave { color: var(--suave); font-size: .9em; }

#app { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr auto; }
#principal { min-width: 0; display: flex; flex-direction: column; }

header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--borde); background: var(--superficie); }
header h1 { font: 600 1.05rem/1.3 var(--titulos); margin: 0; }
header h1 .logo { color: var(--acento); }
.controles { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.controles label { display: inline-flex; gap: 6px; align-items: center; font-size: .85em; color: var(--suave); }
select { padding: 3px 6px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); max-width: 60vw; }
header .meta { color: var(--suave); font-size: .82em; }

nav#pestanas { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--borde); background: var(--superficie); overflow-x: auto; }
nav#pestanas button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--suave); padding: 9px 12px; cursor: pointer; white-space: nowrap; }
nav#pestanas button[aria-current="page"] { color: var(--texto); border-bottom-color: var(--acento); font-weight: 600; }
.cuenta { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 9px; background: var(--peligro); color: var(--fondo); font-size: 12px; text-align: center; font-weight: 600; }

main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 18px 20px 40px; min-width: 0; }
.tarjeta-proy { cursor: pointer; }
.tarjeta-proy:hover { border-color: var(--acento); }
.chips-proy { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; }
.rejilla { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; min-width: 0; }
.tarjeta h2 { font: 600 1rem/1.3 var(--titulos); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; min-width: 0; }
.tarjeta h2 > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.tarjeta h2 small { color: var(--suave); font-weight: 400; font-size: .78em; white-space: nowrap; }
.progreso { display: block; height: 6px; background: var(--barra); border-radius: 3px; overflow: hidden; margin: 6px 0; min-width: 60px; }
.progreso > i { display: block; height: 100%; background: var(--ok); }
.barra-txt { white-space: pre; letter-spacing: 0; }
.barra-txt b { font-weight: 400; color: var(--ok); }
.barra-txt i { font-style: normal; color: var(--barra); }
.fila { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--borde); font-size: .93em; min-width: 0; }
.fila:first-child { border-top: 0; }
.fila > :first-child { min-width: 0; overflow-wrap: anywhere; }
.etq-formato { display: inline-block; padding: 0 6px; margin-right: 4px; border: 1px solid var(--borde); border-radius: var(--radio); font: 600 11px/1.6 var(--mono); color: var(--acento); white-space: nowrap; }
.espera-resultado { display: grid; gap: 8px; margin: 8px 0; }
.espera-resultado p { margin: 2px 0 0; }
.llano { overflow-wrap: anywhere; }
details.tecnico { display: inline; }
details.tecnico > summary { display: inline; cursor: pointer; font-size: .8em; margin-left: 4px; }
ul.tareas.falta details.tecnico[open] { display: block; }
.etq { display: inline-block; padding: 1px 7px; border-radius: var(--radio); font: 600 12px/1.6 var(--mono); white-space: nowrap; }
.MERGED { background: color-mix(in srgb, var(--morado) 18%, transparent); color: var(--morado); }
.OPEN { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.CLOSED { background: color-mix(in srgb, var(--peligro) 18%, transparent); color: var(--peligro); }
.DRAFT { background: var(--barra); color: var(--suave); }
.lateral { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .lateral { grid-template-columns: minmax(0, 1fr); } }
.lista button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--borde); padding: 8px 6px; color: var(--texto); cursor: pointer; overflow-wrap: anywhere; }
.lista button:first-child { border-top: 0; }
.lista button[aria-current="true"] { background: var(--sel); }
.md { overflow-wrap: anywhere; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--titulos); scroll-margin-top: 16px; }
.md h1 { font-size: 1.35em; } .md h2 { font-size: 1.12em; border-bottom: 1px solid var(--borde); padding-bottom: 4px; } .md h3 { font-size: 1em; }
.md code, .cuerpo code, .mapa-cab code, .panel-falta code, .titulo code { font-size: .88em; background: var(--codigo); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.md pre { background: var(--codigo); padding: 12px; border-radius: var(--radio); overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--borde); padding: 4px 8px; vertical-align: top; }
.md blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--borde); color: var(--suave); }
.md li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.2em; }
.md input[type=checkbox] { margin-right: 6px; }
.md li:has(> input:checked) { color: var(--suave); }
.md .destacado { background: var(--sel); }
.diff { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
.diff .mas { color: var(--ok); } .diff .menos { color: var(--peligro); text-decoration: line-through; opacity: .8; }
details summary { cursor: pointer; }
.boton { display: inline-block; padding: 4px 10px; border: 1px solid var(--borde); border-radius: var(--radio); text-decoration: none; color: var(--texto); background: var(--superficie); font-size: .85em; margin: 0 6px 6px 0; cursor: pointer; }
.enlace { background: none; border: 0; padding: 0; color: var(--acento); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.vacio { color: var(--suave); padding: 20px; text-align: center; }
.hash { font-size: .85em; }

/* ---------- Barra de archivos + conmutador ---------- */
.archivos { display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid var(--borde); margin-bottom: 12px; }
.archivos button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px; cursor: pointer; color: var(--suave); white-space: nowrap; font-size: .85em; }
.archivos button[aria-current="true"] { color: var(--texto); border-bottom-color: var(--acento); }
.archivos .n { margin-left: 6px; }
.barra-vista { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.conmutador { display: inline-flex; border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; }
.conmutador button { background: none; border: 0; padding: 4px 12px; cursor: pointer; color: var(--suave); }
.conmutador button[aria-pressed="true"] { background: var(--acento); color: var(--sobre-acento); }

/* ---------- Mapa ---------- */
.mapa-cab { border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 14px; margin-bottom: 16px; background: var(--superficie); min-width: 0; }
.mapa-cab .global { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.mapa-cab .global .progreso { flex: 1 1 200px; height: 8px; }
.mapa-cab p { margin: 8px 0 0; overflow-wrap: anywhere; }
.aqui .rotulo-aqui { color: var(--acento); font-weight: 700; font-family: var(--mono); }
.estado-res { margin-top: 8px; font-size: .92em; }
.estado-res .md > :first-child { margin-top: 0; } .estado-res .md > :last-child { margin-bottom: 0; }
.mapa-rejilla { container-type: inline-size; }
.mapa-interior { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@container (min-width: 880px) {
  .mapa-interior { grid-template-columns: minmax(0, 1fr) 300px; }
  .panel-falta { position: sticky; top: 12px; max-height: calc(100dvh - 12px - var(--alto-barra) - var(--margen-rotulo)); overflow: auto; }
}
ol.linea { list-style: none; margin: 0; padding: 0; counter-reset: paso; }
.paso { counter-increment: paso; scroll-margin-top: 16px; min-width: 0; }
.paso > details > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 6px 4px; border-radius: var(--radio); }
.paso > details > summary::-webkit-details-marker { display: none; }
.paso > details > summary:hover { background: var(--sel); }
.paso.actual > details > summary { background: color-mix(in srgb, var(--acento) 12%, transparent); box-shadow: inset 3px 0 0 var(--acento); }
.glifo { color: var(--borde); flex: none; }
.icono { flex: none; width: 1.3em; text-align: center; font-weight: 700; }
.est-hecho > details > summary .icono { color: var(--ok); }
.est-en-curso > details > summary .icono { color: var(--aviso); }
.est-pendiente > details > summary .icono { color: var(--suave); }
.cab-paso { flex: 1 1 16rem; min-width: 0; overflow-wrap: anywhere; }
.cab-paso .titulo { font-family: var(--titulos); font-weight: 600; }
.est-hecho > details > summary .titulo { color: var(--suave); font-weight: 400; }
.avance { flex: none; margin-left: auto; display: inline-flex; gap: 8px; align-items: center; color: var(--suave); }
.avance .progreso { width: 90px; margin: 0; }
.chip { display: inline-block; margin-left: 8px; font-size: .78em; color: var(--suave); white-space: nowrap; }
.chip.ch-aviso { color: var(--aviso); }
.etq-aqui { margin-left: 8px; color: var(--acento); font: 700 .78em var(--mono); white-space: nowrap; }
.cuerpo { margin: 2px 0 10px calc(.6em + 4px); padding: 4px 0 4px 14px; border-left: 1px solid var(--borde); min-width: 0; }
.cuerpo .nota { margin: 2px 0 8px; color: var(--suave); font-size: .9em; }
.rotulo { font-size: .76em; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); margin: 6px 0 4px; }
.grupo { margin: 4px 0 8px; }
details.grupo > summary { list-style: none; } details.grupo > summary::-webkit-details-marker { display: none; }
details.grupo > summary::before { content: "▸ "; } details.grupo[open] > summary::before { content: "▾ "; }
ul.tareas { list-style: none; margin: 0; padding: 0; }
ul.tareas ul.tareas { margin-left: 0; }
ul.tareas.falta li { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.tarea { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 .6em; padding: 3px 0; }
.tarea > ul { grid-column: 2; }
.casilla { color: var(--suave); white-space: pre; }
.tarea.hecha > .texto { color: var(--suave); }
.tarea:not(.hecha) > .casilla { color: var(--acento); }
.texto { min-width: 0; overflow-wrap: anywhere; }
.vinculo { border: 1px dashed var(--borde); border-radius: var(--radio); padding: 6px 10px; margin: 4px 0 10px; }
.documentacion { margin-top: 22px; border-top: 1px solid var(--borde); padding-top: 8px; }
.documentacion ul { list-style: none; margin: 0; padding: 0; }
.documentacion ul ul { padding-left: 1.4em; }
.documentacion li { padding: 2px 0; }
.panel-falta { border: 1px solid var(--borde); border-radius: var(--radio); padding: 10px 12px; background: var(--superficie); min-width: 0; }
.panel-falta .grupo-falta { margin: 8px 0 12px; }
.panel-falta ul { margin: 4px 0 0; padding-left: 1.1em; font-size: .88em; }
.panel-falta li { margin: 3px 0; overflow-wrap: anywhere; }
.panel-falta li::marker { color: var(--acento); }
.hito-cuerpo p { margin: 4px 0 8px; overflow-wrap: anywhere; }

/* ---------- Resumen: mapa en miniatura ---------- */
.segmentos { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 6px; }
.seg { display: inline-flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 2px; cursor: pointer; color: var(--suave); border-radius: var(--radio); }
.seg .bloque { display: block; width: 2.4em; height: 1.1em; line-height: 1.1em; text-align: center; overflow: hidden; }
.seg .clave { font-size: .72em; }
.seg.actual .clave { color: var(--acento); font-weight: 700; }
.seg.actual { outline: 1px solid var(--acento); }
.seg.est-hecho .bloque { color: var(--ok); } .seg.est-en-curso .bloque { color: var(--aviso); } .seg.est-pendiente .bloque { color: var(--barra); }

/* ---------- Barra de estado (abajo, fija) ---------- */
#barra-estado { display: flex; flex-wrap: wrap; align-items: center; gap: 0 18px; position: sticky; bottom: 0; z-index: 5; background: var(--estado-fondo); color: var(--texto); border-top: 1px solid var(--borde); font-size: 12.5px; padding: 3px 14px; }
#barra-estado button { background: none; border: 0; color: inherit; padding: 1px 0; cursor: pointer; }
#barra-estado button:hover { text-decoration: underline; text-underline-offset: 2px; }
#barra-estado :focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
#barra-estado .rama-barra { font-weight: 700; background: var(--acento); color: var(--sobre-acento); padding: 1px 8px; }
#barra-estado .vivo { color: var(--ok); } #barra-estado .manual { color: var(--suave); }
#barra-estado .derecha { margin-left: auto; }

/* ---------- Rama: siempre visible ---------- */
.rama { display: inline-flex; align-items: center; gap: .35em; max-width: 100%; padding: 0 .55em; border: 1px solid color-mix(in srgb, var(--rama, var(--aviso)) 70%, transparent); background: color-mix(in srgb, var(--rama, var(--aviso)) 14%, transparent); color: var(--rama, var(--aviso)); font-weight: 600; font-size: .85em; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: baseline; }
button.rama { cursor: pointer; font-family: var(--mono); }
button.rama:hover { background: color-mix(in srgb, var(--rama, var(--aviso)) 26%, transparent); }
.cab-paso .rama { margin-left: 8px; }
.rama-main { --rama: var(--acento); background: var(--acento); color: var(--sobre-acento); border-color: var(--acento); }
.rama-dev { --rama: var(--azul); background: var(--azul); color: var(--sobre-acento); border-color: var(--azul); }
button.rama-main:hover { background: color-mix(in srgb, var(--acento) 80%, var(--texto)); }
button.rama-dev:hover { background: color-mix(in srgb, var(--azul) 80%, var(--texto)); }
.rama-actual { font-size: .95em; padding: 2px .7em; box-shadow: 0 0 0 2px var(--fondo), 0 0 0 3.5px var(--rama, var(--aviso)); }
.cab-carriles { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0 0 10px; }
.cab-carriles .carril { display: inline-flex; align-items: center; gap: .4em; }
.cab-carriles .carril i { width: 14px; height: 3px; background: var(--rama); }
.rama-actual .punto { width: .5em; height: .5em; border-radius: 50%; background: currentColor; flex: none; }
.titulo-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-width: 0; }

/* ---------- GitHub: ramas + grafo ---------- */
.ramas { width: 100%; border-collapse: collapse; font-size: .9em; }
.ramas td { padding: 7px 8px 7px 0; border-top: 1px solid var(--borde); vertical-align: top; }
.ramas tr:first-child td { border-top: 0; }
.ramas tr.foco td { background: var(--sel); }
.ramas .col-rama { width: 1%; max-width: 46vw; }
.ramas .sesiones { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.sesion { display: inline-flex; gap: 4px; align-items: baseline; background: none; border: 1px solid var(--borde); padding: 0 6px; cursor: pointer; color: var(--texto); font: .85em/1.6 var(--mono); text-align: left; overflow-wrap: anywhere; }
.sesion:hover { border-color: var(--acento); }
.sesion .ic-hecho { color: var(--ok); } .sesion .ic-en-curso { color: var(--aviso); } .sesion .ic-pendiente { color: var(--suave); }
.sesion.plan { border-style: dashed; }
.tabla-scroll { overflow-x: auto; }
.grafo { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; }
.grafo svg { display: block; }
.grafo-filas { list-style: none; margin: 0; padding: 0; min-width: 0; }
.grafo-fila { height: 30px; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; font-size: .9em; padding-right: 4px; }
.grafo-fila.foco { background: var(--sel); }
.grafo-fila .tit { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
.grafo-fila .tit.merge { color: var(--suave); }
.grafo-fila .cuando { color: var(--suave); flex: none; font-size: .9em; }
.grafo-fila .rama { flex: none; max-width: 40%; }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85em; color: var(--suave); margin: 0 0 10px; }

/* ---------- Esquema de un plan ---------- */
.items { margin: 2px 0 6px; padding-left: 1.6em; }
.items li { margin: 3px 0; overflow-wrap: anywhere; }
.items li::marker { color: var(--acento); }
ul.items { list-style: "- "; }
.prompt-copiable { margin: 8px 0; border: 1px solid var(--borde); background: var(--superficie); min-width: 0; }
.prompt-copiable .prompt-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 8px; border-bottom: 1px solid var(--borde); }
.prompt-copiable .prompt-cab .rotulo { margin: 0; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.prompt-copiable .boton { margin: 0; flex: none; }
.prompt-copiable pre { margin: 0; padding: 10px 12px; max-height: 18em; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; font: 13px/1.5 var(--mono); background: var(--codigo); }
.prompt-copiable pre:focus-visible { outline-offset: -2px; }
.atajo-prompts { margin: 8px 0 0; }
.acciones-esquema { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }

/* ---------- GitHub: ramas + grafo a la derecha ---------- */
.gh-rejilla { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.gh-rejilla > section { margin: 0; min-width: 0; }
.gh-rejilla .gh-prs { margin: 0; }

// ---------- Progreso en texto ----------

// Enlaza «PR #N», «#N» y hashes de commits conocidos con GitHub antes de renderizar el markdown.
function enlazar(md) {
  const url = P.git?.url;
  if (!url) return md;
  const oids = (P.git.commits || []).map((c) => c.oid).concat((P.git.prs || []).flatMap((p) => p.commits.map((c) => c.oid)));
  return md
    .replace(/(^|[^\[\w/])(PR\s*)?#(\d{1,4})\b/gm, (m, a, pr, n) => (P.git.prs || []).some((p) => p.number == n) ? `${a}[${pr || ''}#${n}](${url}/pull/${n})` : m)
    .replace(/(^|[\s(])`?([0-9a-f]{7,40})`?(?=[\s).,:;]|$)/gm, (m, a, h) => oids.some((o) => o.startsWith(h)) ? `${a}[\`${h.slice(0, 7)}\`](${url}/commit/${h})` : m);
}
function md(texto) {

  return `<pre class="md">${esc(texto)}</pre>`;
}
const inline = (t) => window.marked ? marked.parseInline(enlazar(t || '')) : esc(t);
// Títulos dentro de <summary>: sin enlaces anidados.
const inlineTitulo = (t) => window.marked ? marked.parseInline(String(t).replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')).replace(/<a [^>]*>|<\/a>/g, '') : esc(t);

}

// Formato de backlog: «[tipo] llano — técnico». Sin « — » (o con código/más de 12 palabras antes) se muestra como siempre.

const etiquetasFormato = (hito, aqui, tarea) => `<div class="chips-proy">${hito?.titulo ? `<span class="etq-formato" title="Épica (hito)">Épica</span>` : ''}${hito?.historia ? `<span class="etq-formato" title="Historia de usuario">Historia</span>` : ''}${aqui?.clave ? `<span class="etq-formato" title="Sesión ${esc(aqui.clave)}">Sesión ${esc(aqui.clave)}</span>` : ''}${tarea ? `<span class="etq-formato" title="Tarea en curso">Tarea</span>` : ''}</div>`;

// ---------- Mapa de un backlog ----------
function paso(s, ctx) {

  const abierto = abiertos.has(k) ? abiertos.get(k) : (esAqui || contieneAqui || s.estado === 'pendiente');
  const hijas = s.hijas.filter((x) => x.estado !== 'doc');
  return `<li class="paso est-${s.estado}${esAqui ? ' actual' : ''}${esFavorita(s) ? ' fav' : ''}" id="${idPaso(clave, s.id)}">
    <details data-k="${esc(k)}"${abierto ? ' open' : ''}>
      ${cabeceraPaso({ titulo: s.titulo, meta: s.meta, esAqui, ultimo, hechas: s.hechas, total: s.total, estado: s.estado, extra: estrella(s) })}
      <div class="cuerpo">${cuerpo(s)}${hijas.length ? `<ol class="linea">${hijas.map((x, i) => paso(x, { ...ctx, ultimo: i === hijas.length - 1 })).join('')}</ol>` : ''}</div>
    </details></li>`;

function cuerpo(s) {
  const falta = s.tareas.filter((t) => !completa(t)), hecho = s.tareas.filter(completa);
  let html = s.meta.nota ? `<p class="nota">${inline(s.meta.nota)}</p>` : '';
  if (s.vinculo) html += vinculo(s.vinculo);
  html += promptsHtml(s.prompts);
  if (falta.length) html += `<div class="grupo"><div class="rotulo">Falta · ${falta.reduce((a, t) => a + pendientes(t), 0)}</div><ul class="tareas">${falta.map(tarea).join('')}</ul></div>`;
  if (hecho.length) html += `<details class="grupo"><summary class="rotulo">Hecho · ${hecho.reduce((a, t) => a + cajas(t), 0)}</summary><ul class="tareas">${hecho.map(tarea).join('')}</ul></details>`;

}
// Coletilla de la metodología: toda sesión cierra con /relevo (salvo que el plan ya lo diga).
const COLETILLA_RELEVO = 'Al terminar, o si recibes el aviso de contexto, ejecuta /relevo.';
const conRelevo = (texto) => /\/relevo\b/.test(texto) ? texto : `${texto.trimEnd()}\n\n${COLETILLA_RELEVO}`;

function promptsHtml(prompts = []) {

}
async function copiarTexto(texto) {

  const t = document.createElement('textarea');
  t.value = texto; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(t); t.select();

function vinculo(archivo) {

  const pasos = hijo.estructura.filter((s) => s.estado !== 'doc'), { h, t } = sumar(pasos);

    <ol class="linea">${pasos.map((x, i) => paso(x, { doc: hijo, clave: hijo.archivo, ultimo: i === pasos.length - 1 })).join('')}</ol></div>`;

function documentacion(secs) {

// fuente = backlog con las tareas; enOtra = el panel vive en otra página (el PLAN) → los enlaces navegan.

    .filter((g) => g.falta.length || g.hijo);

  const ir = (s) => enOtra ? `data-ir="backlogs" data-sel="${esc(fuente.archivo)}" data-sec="${s.id}"` : `data-saltar="${idPaso(fuente.archivo || fuente.nombre, s.id)}"`;
  return `<aside class="panel-falta" aria-label="Qué falta"><div class="rotulo">Qué falta · ${total}</div>

      return `<div class="grupo-falta"><button class="enlace" ${ir(s)}>${esc(plano(s.titulo))}</button> <span class="n suave">${falta.reduce((a, t) => a + pendientes(t), 0)}</span>

// El Estado sin la viñeta «Para retomar (fecha): …» ni sus líneas sangradas (esa va en su propia tarjeta).

function vistaMapa(doc) {

  if (!pasos.length) return esquema(doc);
  const { h, t } = sumar(pasos);

function htmlMetodologia(g, sel) {
  const COL = { ok: 'verde', parcial: 'ambar', falta: 'rojo' }, COLP = { activa: 'verde', instalada: 'ambar', falta: 'rojo' };
  const TXT = { ok: 'todo activo', parcial: 'parcial', falta: 'falta algo' }, TXTP = { activa: 'activa', instalada: 'instalada, sin activar', falta: 'falta' };

  const pos = {}; (g.etapas || []).forEach((e, i) => { pos[e.id] = i < 4 ? { x: 10 + i * 175, y: 55 } : { x: 10 + 4 * 175, y: i === 4 ? 10 : 100 }; });

  }).join('');
  const nodos = (g.etapas || []).map((e) => `<g data-etapa="${esc(e.id)}" class="nodo nodo-${COL[e.estado] || 'ambar'}${e.id === etapaSel ? ' sel' : ''}" data-meta="${esc(e.id)}" role="button" tabindex="0" aria-label="${esc(e.nombre)}: ${TXT[e.estado] || e.estado}">
      <rect x="${pos[e.id].x}" y="${pos[e.id].y}" width="${W}" height="${H}" rx="3"/>
      <text x="${pos[e.id].x + 10}" y="${pos[e.id].y + 19}">${esc(e.nombre)}</text>
      <text class="sub" x="${pos[e.id].x + 10}" y="${pos[e.id].y + 35}">${TXT[e.estado] || ''} · ${e.piezas.length}</text></g>`).join('');

  const piezasDe = (id) => (g.piezas || []).filter((p) => p.etapa === id).map((p) => `<li><button class="meta-pieza pieza-${COLP[p.estado] || 'ambar'}" data-meta="${esc(p.id)}" aria-pressed="${p.id === sel}"><span class="punto" aria-hidden="true">●</span> ${esc(p.nombre)} <span class="suave">${esc(p.tipo)}</span></button></li>`).join('');

    ? `<h3>${esc(pieza.nombre)} <span class="etq pieza-${COLP[pieza.estado] || 'ambar'}">${TXTP[pieza.estado] || esc(pieza.estado)}</span></h3><p>${esc(pieza.descripcion)}</p>
       ${pieza.motivo ? `<p class="pieza-rojo">${esc(pieza.motivo)}</p>` : ''}${pieza.ruta ? `<p class="suave">${esc(pieza.ruta)}</p>` : ''}<p><span class="rotulo">Lo usan</span> ${usa(pieza)}</p>`
    : etapaSel ? `<h3>${esc((g.etapas.find((e) => e.id === etapaSel) || {}).nombre)}</h3><p class="suave">Toca una pieza para ver qué hace y qué proyectos la usan.</p>`

  return `${g.aviso ? `<p class="aviso-meta">${esc(g.aviso)}</p>` : ''}<section class="tarjeta meta">
    <h2><span>Metodología viva</span><small>${(g.proyectos || []).filter((p) => p.conectado).length} proyecto(s) con sesiones</small></h2>

function filaPR(pr, sinFila) {

// ---------- Plan en curso ----------
// Puro: recibe un proyecto y devuelve el hito/plan en que se trabaja (o null si no hay backlog con «estás aquí»).

  const delPlan = plan ? aplanar(plan.estructura).flatMap((x) => x.prompts) : [];

    : tarea ? (tarea.abiertas.length ? tarea.abiertas : siguiente ? [siguiente.texto] : [])
    : aplanar([aqui]).flatMap((x) => x.tareas.filter((t) => !t.hecha).map((t) => t.texto));

  const gasto = filas.length ? { ...(agregarBit(filas, 'rama').grupos[0] || { costo: 0, minutos: 0, sesiones: 0 }), sesionesTotal: filas.length } : null;

}
// «Para retomar»: lo que dejó escrito quien cerró la última sesión + los hechos de git/Claude en frases.

// ---------- Vista «Todos los proyectos» ----------
const hoyMenos = (d) => new Date(Date.now() - d * 864e5).toISOString().slice(0, 10);
function resumenProyecto(p) {
  const bl = p.backlogs.filter((b) => !b.esPlan);
  const hechas = bl.reduce((a, b) => a + b.hechas, 0), total = bl.reduce((a, b) => a + b.total, 0);
  const principal = bl.find((b) => b.aqui) || bl[0];
  const aqui = principal && aplanar(principal.estructura || []).find((s) => s.id === (principal.activo?.seccion || principal.aqui));
  const hijo = aqui?.vinculo && p.backlogs.find((b) => b.archivo === aqui.vinculo);
  const sub = hijo && aplanar(hijo.estructura || []).find((s) => s.id === hijo.aqui);
  const g = p.git;
  const propias = (p.bitacora?.registro || []).filter((f) => f.proyecto === p.id);
  const desde = hoyMenos(7);
  const costo7 = propias.filter((f) => typeof f.costo === 'number' && /^\d{4}-\d\d-\d\d/.test(f.fecha || '') && f.fecha >= desde).reduce((a, f) => a + f.costo, 0);
  const fechas = [...p.backlogs.map((b) => b.modificado), p.notas?.modificado, g?.commits?.[0]?.fecha, ...propias.map((f) => /^\d{4}-\d\d-\d\d$/.test(f.fecha || '') ? f.fecha : null)].filter(Boolean);
  const ultima = fechas.sort((a, b) => new Date(b) - new Date(a))[0];
  return { p, hechas, total, principal, aqui, sub, g, prs: (g?.prs || []).filter((x) => x.state === 'OPEN').length, sinPush: g?.sinPush?.length || 0,
    notas: p.notas?.abiertas.length || 0, bit: propias.filter((f) => f.pendiente && f.sid).length, costo7, ultima };
}
function vistaTodos() {

  const ir = (r, pest, txt, cls = 'enlace') => `<button class="${cls}" data-proy="${esc(r.p.id)}" data-pest="${pest}">${txt}</button>`;

  if (crear.tipo === 'importar') return { proyecto: P.id, integracion: c.integracion, soloMias: !!c.soloMias, ...nombre, previa };
  const lista = (t) => String(t || '').split(',').map((x) => x.trim()).filter(Boolean);
  if (crear.tipo === 'editar') return { id: P.id, cambios: { nombre: c.nombre.trim(), repo: c.repo.trim(), docs: lista(c.docs), notas: c.notas.trim(), bitacora: c.bitacora.trim() }, mtime: DATOS.configMtime ?? undefined, previa };
  return { id: c.id.trim(), nombre: c.nombre.trim(), repo: c.repo.trim() || undefined, docs: lista(c.docs).length ? lista(c.docs) : undefined, mtime: DATOS.configMtime ?? undefined, previa };
}
function pintarCrear() {
  const el = $('#panel-crear'); if (!el) return;
  if (!crear) { el.innerHTML = ''; return; }
  const pr = crear.previa, ed = crear.tipo === 'editar', imp = crear.tipo === 'importar', proy = crear.tipo === 'proyecto' || ed;
  const accion = ed ? 'Guardar cambios' : proy ? 'Crear proyecto' : `Crear ${crear.previa?.archivo || 'backlog'}`;
  const integ = imp ? (P.integraciones || []).find((x) => x.id === crear.campos.integracion) : null;
  const sinMio = imp && !(integ?.items || []).some((x) => x.mio);
  // Si ya hay backlog, el nuevo es secundario y lleva nombre (BACKLOG_<NOMBRE>.md): nunca reemplaza al principal.
  const hayBacklog = !proy && (P?.backlogs || []).some((b) => !b.esPlan), pideNombre = crear.tipo === 'backlog' && hayBacklog;
  const campoNombre = crear.tipo === 'backlog' || imp ? `<label class="campo-fi" for="cr-nombre"><span>Nombre del backlog${pideNombre ? '' : ' (opcional)'}</span><input id="cr-nombre" data-crear-campo="nombre" value="${esc(crear.campos.nombre)}" placeholder="p. ej. Sprint 3, Soporte, Azure mías" autocomplete="off"${pideNombre ? ' required' : ''}><small class="suave">Se guarda como <code>BACKLOG_&lt;NOMBRE&gt;.md</code> junto al principal, sin tocarlo.${imp ? ` Vacío: <code>BACKLOG_${esc(P.id.toUpperCase().replace(/[^A-Z0-9]+/g, '_'))}.md</code>.` : pideNombre ? '' : ' Vacío: <code>BACKLOG.md</code>.'}</small></label>` : '';
  el.innerHTML = `<form id="form-crear" class="tarjeta" aria-label="${ed ? 'Editar proyecto' : proy ? 'Nuevo proyecto' : imp ? 'Crear backlog desde Azure' : 'Crear backlog'}">
    <h2><span>${ed ? `Editar «${esc(P.nombre)}»` : proy ? 'Nuevo proyecto' : imp ? `Crear backlog local de «${esc(P.nombre)}»` : `Crear backlog de «${esc(P.nombre)}»`}</span></h2>
    ${proy ? (ed ? CAMPOS_EDITAR : CAMPOS_PROY).map(([k, t, ayuda]) => {
        const conBoton = CAMPOS_CARPETA.includes(k);
        return `<div class="campo-fi"><label for="cr-${k}"><span>${t}</span></label><div class="fila-carpeta"><input id="cr-${k}" data-crear-campo="${k}" value="${esc(crear.campos[k])}" autocomplete="off" spellcheck="false"${conBoton ? ' placeholder="Elige con el botón o pega la ruta"' : ''}${k === 'id' || k === 'nombre' ? ' required' : ''}>${conBoton ? `<button class="boton" type="button" data-elegir-carpeta="${k}" aria-expanded="${crear.sel?.campo === k}">Elegir…</button>` : ''}</div>${ayuda ? `<small class="suave">${ayuda}</small>` : ''}${k === 'docs' && !ed ? casillasDocs() : ''}${crear.sel?.campo === k ? selectorCarpeta() : ''}</div>`;
      }).join('')
      : imp ? `<p class="suave">Se crea un backlog en la primera carpeta de documentos, con una casilla por ítem de «${esc(integ?.nombre || crear.campos.integracion)}» (agrupadas por estado y tipo, con su vínculo). Nunca sobrescribe un archivo que ya exista ni cambia nada en Azure.</p>
        ${campoNombre}
        <label><input type="checkbox" data-crear-check="soloMias"${crear.campos.soloMias ? ' checked' : ''}${sinMio ? ' disabled' : ''}> Solo las asignadas a mí${sinMio ? ' <span class="suave">(esta integración no dice cuáles son tuyas)</span>' : ''}</label>`
      : `<p class="suave">${hayBacklog ? 'Se crea un backlog secundario' : 'Se crea el backlog'} con una plantilla mínima en la primera carpeta de documentos del proyecto. Nunca sobrescribe un archivo que ya exista.</p>${campoNombre}`}
    ${crear.error ? `<div class="integ-paso mal" role="alert">${esc(crear.error)}</div>` : ''}
    ${pr ? (proy ? `<div class="integ-paso" role="status">${ed ? 'Quedará en' : 'Se añadirá a'} <code>${esc(pr.archivo)}</code>:<pre>${esc(JSON.stringify(pr.proyecto, null, 2))}</pre></div>`
      : `<div class="integ-paso" role="status">Se creará <code>${esc(pr.ruta)}</code>${imp ? ` con ${pr.total} ítems` : ''}:${(pr.avisos || []).map((a) => `<br><span class="suave">${esc(a)}</span>`).join('')}<pre>${esc(pr.contenido)}</pre></div>`) : ''}
    <div class="pie">${pr ? `<button class="boton primario" type="submit"${crear.ocupado ? ' disabled' : ''}>${accion}</button>` : `<button class="boton primario" type="submit"${crear.ocupado ? ' disabled' : ''}>Vista previa</button>`}<button class="boton" type="button" data-crear-cerrar>Cancelar</button></div>
  </form>`;
}
// ---------- Selector de carpeta (recientes de Claude + explorar; el servidor nunca sale de ~) ----------
const CAMPOS_CARPETA = ['repo', 'docs', 'notas', 'bitacora'];
let recientes = null; // { home, sugerencias } de la primera consulta
const corta = (r, home) => home && r && (r === home || r.startsWith(home + '/')) ? '~' + r.slice(home.length) : r;
const enlista = (t) => String(t || '').split(',').map((x) => x.trim()).filter(Boolean);
function casillasDocs() {
  const cand = crear.propuesta?.docs || []; if (cand.length < 2) return '';
  const act = enlista(crear.campos.docs);
  return `<fieldset class="casillas-docs"><legend class="suave">Carpetas candidatas para documentos</legend>${cand.map((d) => `<label><input type="checkbox" data-docs-casilla="${esc(d)}"${act.includes(d) ? ' checked' : ''}> ${esc(d)}</label>`).join('')}</fieldset>`;
}
function selectorCarpeta() {
  const s = crear.sel, home = s.home || recientes?.home;
  const pest = (k, t) => `<button type="button" role="tab" class="boton${s.pestana === k ? ' primario' : ''}" aria-selected="${s.pestana === k}" data-carpeta-pestana="${k}">${t}</button>`;
  let cuerpo;
  if (s.cargando) cuerpo = '<p class="suave" role="status">Cargando…</p>';
  else if (s.error) cuerpo = `<div class="integ-paso mal" role="alert">${esc(s.error)}</div>`;
  else if (s.pestana === 'recientes') {
    const l = recientes?.sugerencias || [];
    cuerpo = l.length ? `<p class="suave">Tus proyectos recientes</p><ul class="lista-carpetas">${l.map((x) => `<li><button type="button" data-carpeta="${esc(x.ruta)}" data-elige="1"><b>${esc(x.nombre)}</b> <span class="suave">${esc(corta(x.ruta, home))} · ${x.ultimaActividad ? hace(x.ultimaActividad) : ''} · ${x.sesiones} ses.</span>${x.esGit ? ' <span class="chip">git</span>' : ''}</button></li>`).join('')}</ul>` : '<p class="suave">No hay carpetas recientes sin configurar. Usa «Explorar».</p>';
  } else {
    const d = s.datos;
    if (!d) cuerpo = '';
    else {
      cuerpo = `<p class="suave migas">${esc(corta(d.ruta, home))}</p>
        <div class="fila-carpeta"><button type="button" class="boton" data-carpeta="${esc(d.padre || '')}"${d.padre ? '' : ' disabled'}>↑ subir</button><button type="button" class="boton primario" data-carpeta="${esc(d.ruta)}" data-elige="1">Elegir esta carpeta</button><input type="search" data-carpeta-filtro placeholder="Filtrar…" aria-label="Filtrar carpetas" autocomplete="off"></div>
        ${d.aviso ? `<p class="suave">${esc(d.aviso)}</p>` : ''}<ul class="lista-carpetas">${d.carpetas.map((x) => `<li data-nombre="${esc(x.nombre.toLowerCase())}"><button type="button" data-carpeta="${esc(x.ruta)}">📁 ${esc(x.nombre)}${x.esGit ? ' <span class="chip">git</span>' : ''}${x.tieneBacklog ? ' <span class="chip">backlog</span>' : ''}</button></li>`).join('') || '<li class="suave">Sin subcarpetas.</li>'}</ul>`;
    }
  }
  return `<div class="selector-carpeta" data-selector role="group" aria-label="Elegir carpeta"><div role="tablist" class="fila-carpeta">${pest('recientes', 'Recientes de Claude')}${pest('explorar', 'Explorar')}<button type="button" class="boton" data-carpeta-cerrar>Cerrar</button></div>${cuerpo}</div>`;
}
async function abrirSelector(campo) {
  if (crear.sel?.campo === campo) { cerrarSelector(); return; }
  crear.sel = { campo, pestana: 'recientes', cargando: !recientes, error: '', datos: null, home: recientes?.home };
  pintarCrear(); enfocarSelector();
  if (!recientes) {
    try { const r = await api('/api/carpetas', {}); recientes = { home: r.home, sugerencias: r.sugerencias || [] }; if (crear?.sel?.campo === campo) { crear.sel.home = r.home; crear.sel.cargando = false; } }
    catch (e) { if (crear?.sel?.campo === campo) { crear.sel.cargando = false; crear.sel.error = e.message; } }
    if (crear?.sel?.campo === campo) { pintarCrear(); enfocarSelector(); }
  }
}
function cerrarSelector() { const k = crear.sel?.campo; crear.sel = null; pintarCrear(); document.querySelector(`[data-elegir-carpeta="${k}"]`)?.focus(); }
const enfocarSelector = () => $('#panel-crear [data-selector] [data-carpeta]')?.focus();
async function navegarCarpeta(ruta) {
  const s = crear.sel; s.cargando = true; s.error = ''; pintarCrear();
  try { const r = await api('/api/carpetas', ruta ? { ruta } : {}); s.datos = r; s.home = r.home; }
  catch (e) { s.error = e.message; }
  s.cargando = false; pintarCrear(); enfocarSelector();
}
async function elegirCarpeta(ruta) {
  const s = crear.sel, campo = s.campo, c = crear.campos;
  let prop = null;
  try { prop = (await api('/api/carpetas', { ruta })).propuesta; } catch { /* la ruta vale igual: el servidor valida al enviar */ }
  const ruta2 = corta(ruta, s.home || recientes?.home);
  if (campo === 'repo') {
    c.repo = ruta2;
    if (crear.tipo === 'proyecto' && prop) {
      crear.propuesta = prop;
      if (!c.id.trim()) c.id = prop.id;
      if (!c.nombre.trim()) c.nombre = prop.nombre;
      if (!c.docs.trim()) c.docs = prop.docs.slice(0, 1).join(', ');
    }
  } else if (campo === 'docs') c.docs = [...new Set([...enlista(c.docs), ruta2])].join(', ');
  else if (campo === 'notas') c.notas = `${ruta2}/${prop?.notas.split('/').pop() || 'NOTAS.md'}`;
  else c.bitacora = `${ruta2}/BITACORA.md`;
  crear.previa = null; crear.sel = null; pintarCrear(); document.getElementById(`cr-${campo}`)?.focus();
}
document.addEventListener('click', (e) => {
  if (!crear) return;
  const t = e.target.closest('[data-elegir-carpeta],[data-carpeta],[data-carpeta-pestana],[data-carpeta-cerrar]'); if (!t) return;
  const d = t.dataset;
  if (d.elegirCarpeta) abrirSelector(d.elegirCarpeta);
  else if ('carpetaCerrar' in d) cerrarSelector();
  else if (d.carpetaPestana) { crear.sel.pestana = d.carpetaPestana; pintarCrear(); if (d.carpetaPestana === 'explorar' && !crear.sel.datos) navegarCarpeta(''); else enfocarSelector(); }
  else if ('carpeta' in d) { if (d.elige) elegirCarpeta(d.carpeta); else navegarCarpeta(d.carpeta); }
});
document.addEventListener('input', (e) => {
  if (!e.target.matches?.('[data-carpeta-filtro]')) return;
  const q = e.target.value.trim().toLowerCase();
  e.target.closest('[data-selector]').querySelectorAll('li[data-nombre]').forEach((li) => { li.hidden = !!q && !li.dataset.nombre.includes(q); });
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset?.docsCasilla; if (!crear || k == null) return;
  const act = enlista(crear.campos.docs).filter((x) => x !== k); if (e.target.checked) act.push(k);
  crear.campos.docs = act.join(', '); crear.previa = null; pintarCrear(); document.querySelector(`[data-docs-casilla="${CSS.escape(k)}"]`)?.focus();
});
document.addEventListener('keydown', (e) => {
  if (!crear?.sel || !e.target.closest?.('[data-selector]')) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cerrarSelector(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const bs = [...e.target.closest('[data-selector]').querySelectorAll('[data-carpeta]:not([disabled])')].filter((b) => !b.closest('li')?.hidden), i = bs.indexOf(e.target);
  if (i < 0 && !bs.length) return; e.preventDefault(); bs[Math.max(0, Math.min(bs.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]?.focus();
}, true);
async function enviarCrear() {
  const c = crear; if (!c || c.ocupado) return;
  const ruta = c.tipo === 'proyecto' ? '/api/proyectos/crear' : c.tipo === 'editar' ? '/api/proyectos/editar' : c.tipo === 'importar' ? '/api/integraciones/importar' : '/api/backlog/crear', previa = !c.previa;
  c.ocupado = true; c.error = ''; pintarCrear();
  try {
    const r = await api(ruta, cuerpoCrear(previa));
    if (previa) { c.previa = r; c.ocupado = false; pintarCrear(); $('#form-crear [type=submit]')?.focus(); return; }
    crear = null; recargarDatos(r.datos); refrescarSelectorProyectos();
    if (c.tipo === 'proyecto') { abrirProyecto(r.proyecto.id, 'backlogs'); avisar(`Proyecto «${r.proyecto.nombre}» creado.`); }
    else if (c.tipo === 'editar') { pintar(); avisar(`Proyecto «${r.proyecto.nombre}» guardado.`); }
    else if (c.tipo === 'importar') {
      // La integración pasa a sincronizar con ese backlog: se abre el formulario ya preparado; queda por pulsar Guardar.
      sel.backlogs = r.archivo; pestana = 'integraciones'; guardar('tablero.pestana', pestana);
      const integ = (P.integraciones || []).find((x) => x.id === c.campos.integracion);
      pintar();
      if (integ) { abrirForm(integ); const cfg = formInteg.cfg; cfg.modo = 'sincronizar'; cfg.auto = false; cfg.backlog = r.archivo; if (r.tipos.length) cfg.tipoItem = r.tipos.length === 1 ? r.tipos[0] : r.tipos.slice(0, 10); else delete cfg.tipoItem; pintarF(); }
      avisar(`${r.archivo} creado con ${r.total} ítems. Revisa la integración y pulsa Guardar para sincronizar con él.`);
    }
    else {
      sel.backlogs = r.archivo;
      if (formInteg) { formInteg.cfg.backlog = r.archivo; formInteg.prueba = null; pintarF(); } // sigue el formulario de integración, con el archivo ya elegido
      else { pestana = 'backlogs'; guardar('tablero.pestana', pestana); pintar(); }
      avisar(`${r.archivo} creado.`);
    }
    pintarCrear();
  } catch (e) {
    c.ocupado = false; c.error = e.estado === 409 && (c.tipo === 'proyecto' || c.tipo === 'editar') ? `${e.message} Recarga la página: proyectos.json cambió.` : e.message; c.previa = null; pintarCrear();
  }
}
function refrescarSelectorProyectos() {
  $('#proyecto').innerHTML = `<option value="todos">Todos los proyectos</option><option value="mias">Mis tareas</option>` + DATOS.proyectos.map((p) => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('');
  $('#proyecto').value = todos ? (mias ? 'mias' : 'todos') : P.id; pintarBotonMias();
}
const botonCrearBacklog = () => editable() ? '<p><button class="boton primario" type="button" data-crear="backlog">＋ Crear backlog</button></p>' : '';
$('#nuevo-proyecto').hidden = !editable();
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-ir-mias]')) { const sl = $('#proyecto'); sl.value = 'mias'; sl.dispatchEvent(new Event('change')); return; }
  const b = e.target.closest('[data-crear], [data-crear-cerrar]');
  if (!b) return;
  if ('crearCerrar' in b.dataset) cerrarCrear(); else abrirCrear(b.dataset.crear, b.dataset.integ);
});
document.addEventListener('input', (e) => {
  if (crear && e.target.dataset?.crearCampo) { crear.campos[e.target.dataset.crearCampo] = e.target.value; if (crear.previa) { crear.previa = null; pintarCrear(); const el = document.getElementById(e.target.id); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length); } }
});
document.addEventListener('change', (e) => {
  if (crear && e.target.dataset?.crearCheck) { crear.campos[e.target.dataset.crearCheck] = e.target.checked; crear.previa = null; pintarCrear(); document.querySelector('[data-crear-check]')?.focus(); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'form-crear') { e.preventDefault(); enviarCrear(); } });
document.addEventListener('keydown', (e) => { if (crear && e.key === 'Escape' && e.target.closest?.('#form-crear')) cerrarCrear(); });

// ---------- Controles de cabecera ----------
const TEMAS = [['auto', 'Auto'], ['light', 'Claro'], ['dark', 'Oscuro']];
$('#tema').innerHTML = TEMAS.map(([v, t]) => `<option value="${v}"${v === (raiz.dataset.theme || 'auto') ? ' selected' : ''}>${t}</option>`).join('');
$('#tema').addEventListener('change', (e) => {
  if (e.target.value === 'auto') delete raiz.dataset.theme; else raiz.dataset.theme = e.target.value;
  guardar('tablero.tema', e.target.value);
});

// El proyecto activo se recuerda por id: #p=<id> en la URL manda sobre localStorage.
const idEnHash = () => decodeURIComponent((location.hash.match(/[#&]p=([^&]*)/) || [])[1] || '');
const buscarProyecto = (id) => DATOS.proyectos.find((p) => p.id === id);
function pintarBotonMias() {
  const n = totalAsignadas(), b = $('#ir-mias'); if (!b) return;
  b.innerHTML = `Mis tareas${n ? ` <span class="n">${n}</span>` : ''}`; b.classList.toggle('primario', !!mias); b.setAttribute('aria-pressed', String(!!mias));
}
function recordarProyecto() {
  pintarBotonMias();
  const id = todos ? (mias ? 'mias' : 'todos') : P.id;
  guardar('tablero.proyecto', id);
  try { history.replaceState(null, '', `#p=${encodeURIComponent(id)}`); } catch {}
  $('#proyecto').value = id;
}
$('#proyecto').innerHTML = `<option value="todos">Todos los proyectos</option><option value="mias">Mis tareas</option>` + DATOS.proyectos.map((p) => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('');
$('#proyecto').addEventListener('change', (e) => { soltarEditor(); mias = e.target.value === 'mias'; todos = e.target.value === 'todos' || mias; if (!todos) P = buscarProyecto(e.target.value); sel = {}; ramaFoco = null; previas.clear(); formInteg = null; quitandoInteg = null; recordarProyecto(); pintar(); });
window.addEventListener('hashchange', () => {
  if (idEnHash() === 'todos' || idEnHash() === 'mias') { const m = idEnHash() === 'mias'; if (!todos || mias !== m) { soltarEditor(); todos = true; mias = m; recordarProyecto(); pintar(); } return; }
  const p = buscarProyecto(idEnHash());
  if (p && (p !== P || todos)) { soltarEditor(); todos = false; mias = false; P = p; sel = {}; ramaFoco = null; previas.clear(); formInteg = null; quitandoInteg = null; recordarProyecto(); pintar(); }
});
const idInicial = idEnHash() || leer('tablero.proyecto') || 'todos';
mias = idInicial === 'mias';
todos = idInicial === 'todos' || mias || !buscarProyecto(idInicial);
P = buscarProyecto(idInicial) || DATOS.proyectos[0];
if (P) recordarProyecto();
if (P) pintar(); else $('#contenido').innerHTML = '<div class="vacio">No hay proyectos en proyectos.json.</div>';
</script>
